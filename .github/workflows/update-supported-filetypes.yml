name: Update supported file types

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-supported-filetypes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.event.repository.default_branch }}
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
    - name: Update supported file types
      run: node scripts/update-supported-filetypes.js
    - name: Create or update pull request
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
        BRANCH: automation/update-supported-filetypes
        TITLE: 'chore: sync supported Neocities file types'
        BODY: |
          This PR synchronizes `lib/supported-filetypes.js` with the current list published by Neocities.

          The list was fetched from https://neocities.org/site_files/allowed_types.
      run: |
        gh auth setup-git
        git add lib/supported-filetypes.js

        if git diff --cached --quiet; then
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git push origin --delete "$BRANCH"
          fi
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$BRANCH"
        git commit -m "$TITLE"
        git push --force-with-lease origin "$BRANCH"

        pr_number=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')
        if [ -z "$pr_number" ]; then
          gh pr create --head "$BRANCH" --base "$BASE_BRANCH" --title "$TITLE" --body "$BODY"
        fi
